    period: Jan 2020 – Dec 2023
    icon: radio
    size: tall
    links:
      - label: View the code
        url: https://github.com/JhonKyG/SemilleroIoT_Spectral_Estimation
      - label: IEEE publication
        url: https://ieeexplore.ieee.org/document/10334282
    summary: >-
      A methodology for acquiring **GNSS** signals through **software defined
      radio**, applying unconventional spectral estimation techniques. Results
      published by **IEEE (2023)** within the IoT research group.
    tags: [GNU Radio, GNSS-SDR, Matlab, Signal processing]
    metrics:
