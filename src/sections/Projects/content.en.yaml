# ---------------------------------------------------------------------------
# FEATURED PROJECTS — English.
# `items` is the list of cards. To add a project, copy a whole block and keep
# the indentation.
#
# Fields:
#   title    → project name
#   kicker   → short category shown above the title
#   period   → dates
#   summary  → description (supports Markdown **bold**)
#   metrics  → highlighted figures (optional, two at most)
#   tags     → technologies
#   icon     → cpu, radio, code, database, cloud, shield, server, terminal...
#   size     → hero | tall | wide  (controls the grid footprint)
#   links    → list of links, each with `label` and `url`.
#              You can add several (repo, paper, demo…) or none: with an empty
#              list the card simply shows no buttons. `label` is the visible
#              text, change it freely.
# ---------------------------------------------------------------------------

eyebrow: Featured projects
title: Applied research and product in production
lead: >-
  From the industrial network lab to the backend serving real users. These are
  the projects that best describe how I work.

items:
  - id: scada-ids
    title: Intrusion detection system for SCADA networks
    kicker: Master's thesis · Industrial cybersecurity
    period: Jan 2024 – Jun 2026
    icon: shield
    size: hero
    links:
      - label: View the code
        url: https://github.com/JhonAlexGS/CASO-DE-ESTUDIO-MODBUS-TCP-IP
    summary: >-
      A **machine learning and deep learning** classifier for **ModBus TCP/IP**
      traffic, trained to tell legitimate operations apart from attacks on
      critical infrastructure. The model was deployed in containers on a
      **Raspberry Pi 5**, proving detection can run at the edge of the
      industrial network and not only on a lab server.
    metrics:
      - value: 99.49%
        label: Accuracy
      - value: +15.28 pp
        label: Above the state of the art
    tags: [Python, TensorFlow, scikit-learn, Docker, ModBus TCP/IP, Raspberry Pi 5]

