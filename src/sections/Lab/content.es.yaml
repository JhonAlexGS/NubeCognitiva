# ---------------------------------------------------------------------------
# LABORATORIO — español. Carrusel de proyectos.
#
# ⚠️  LOS SEIS DE ABAJO SON SUGERENCIAS, NO TRABAJO TUYO.
#     Llevan `placeholder: true`, que pinta una etiqueta de «propuesta» sobre
#     la portada. Cuando construyas uno de verdad —o lo cambies por otro que sí
#     hayas hecho— borra esa línea y la etiqueta desaparece.
#     No publiques ninguno sin quitar el `placeholder` sólo si es real: estarías
#     atribuyéndote trabajo que no hiciste.
#
# Campos de cada proyecto:
#   title    → nombre del proyecto
#   summary  → descripción breve (2 o 3 líneas; se ve entera en la tarjeta)
#   skills   → habilidades o tecnologías aprendidas
#   image    → archivo dentro de `public/`, por ejemplo `proyectos/rag.svg`
#              Proporción 16:9. Si lo dejas vacío sale un marco con el título.
#   url      → enlace del proyecto (repo, demo, artículo…)
#   linkLabel→ texto del botón
#   placeholder → true mientras sea una propuesta y no un proyecto hecho
# ---------------------------------------------------------------------------

