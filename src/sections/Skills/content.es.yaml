# ---------------------------------------------------------------------------
# STACK TÉCNICO — español.
# Cada bloque de `marquee` es un carril del carrusel (alternan de sentido).
# Añade o quita tecnologías dentro de `items` sin tocar el código.
#
#   icon   ícono del letrero: terminal, layers, devops, cloud, server,
#          database, tool, cpu.
#   title  nombre del carril.
#   brand  (opcional) logo para las tecnologías del carril que no tienen uno
#          propio; p. ej. `aws` hace que S3 o Lambda lleven el logo de AWS.
#   items  tecnologías. Las que tienen logo en `src/components/ui/techLogos.js`
#          lo muestran; las demás salen sólo con el nombre.
#
# `marqueeCount` es el texto del contador de cada carril.
# ---------------------------------------------------------------------------

eyebrow: Stack técnico
title: Las herramientas con las que construyo
lead: >-
  Un stack que cubre el recorrido completo: del lenguaje y el framework al
  contenedor, la nube y el tablero que mide si todo eso sirvió para algo.

marquee:
  - icon: terminal
    title: Lenguajes y web
    items: [Python, TypeScript, JavaScript, Java, C++, R, Matlab, SQL, HCL, HTML/CSS, React, Node.js, Express.js]
  - icon: layers
    title: Frameworks y ML
    items: [Spring Boot, FastAPI, TensorFlow, scikit-learn, Jupyter, Databricks, PyCharm, VS Code, NetBeans]
  - icon: devops
    title: DevOps y CI/CD
    items: [Docker, Kubernetes, Terraform, GitHub Actions, Jenkins, SonarQube, Azure Pipelines]
  - icon: cloud
    title: Servicios AWS
    brand: aws
    items: [S3, EC2, ECR, ECS, RDS, Lambda, Athena, Glue, QuickSight, SageMaker, Cloud9]
  - icon: server
    title: Servicios Azure
    brand: azure
    items:
      - Virtual Machines
      - Blob Storage
      - SQL Database
      - Functions
      - AKS
      - Active Directory
      - Data Factory
      - Synapse Analytics
      - Machine Learning
      - DevOps
  - icon: database
    title: Datos y herramientas
    items: [PostgreSQL, MySQL, MariaDB, MongoDB, Redis, Elastic Search, Power BI, Postman, Insomnia, Wireshark, GNU Radio, GNSS-SDR]

marqueeCount: tecnologías

languagesTitle: Idiomas
languages:
  - name: Español
    level: Nativo
  - name: Inglés
    level: B1
