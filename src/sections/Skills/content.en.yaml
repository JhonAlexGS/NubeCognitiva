# ---------------------------------------------------------------------------
# TECH STACK — English.
# Every block inside `marquee` is a carousel lane (lanes alternate direction).
# Add or remove technologies inside `items` without touching any code.
#
#   icon   sign icon: terminal, layers, devops, cloud, server, database,
#          tool, cpu.
#   title  lane name.
#   brand  (optional) logo for the lane's technologies that have none of their
#          own; e.g. `aws` gives S3 or Lambda the AWS logo.
#   items  technologies. Those with a logo in `src/components/ui/techLogos.js`
#          show it; the rest show just their name.
#
# `marqueeCount` is the counter label of each lane.
# ---------------------------------------------------------------------------

eyebrow: Tech stack
title: The tools I build with
lead: >-
  A stack that covers the whole journey: from the language and the framework to
  the container, the cloud and the dashboard that tells you whether any of it
  worked.

marquee:
  - icon: terminal
    title: Languages and web
    items: [Python, TypeScript, JavaScript, Java, C++, R, Matlab, SQL, HCL, HTML/CSS, React, Node.js, Express.js]
  - icon: layers
    title: Frameworks and ML
    items: [Spring Boot, FastAPI, TensorFlow, scikit-learn, Jupyter, Databricks, PyCharm, VS Code, NetBeans]
  - icon: devops
    title: DevOps and CI/CD
    items: [Docker, Kubernetes, Terraform, GitHub Actions, Jenkins, SonarQube, Azure Pipelines]
  - icon: cloud
    title: AWS services
    brand: aws
    items: [S3, EC2, ECR, ECS, RDS, Lambda, Athena, Glue, QuickSight, SageMaker, Cloud9]
  - icon: server
    title: Azure services
    brand: azure
    items:
      - Virtual Machines
      - Blob Storage
      - SQL Database
      - Functions
      - AKS
      - Active Directory
      - Data Factory
      - Synapse Analytics
      - Machine Learning
      - DevOps
  - icon: database
    title: Data and tools
    items: [PostgreSQL, MySQL, MariaDB, MongoDB, Redis, Elastic Search, Power BI, Postman, Insomnia, Wireshark, GNU Radio, GNSS-SDR]

marqueeCount: technologies

languagesTitle: Languages
languages:
  - name: Spanish
    level: Native
  - name: English
    level: B1
