# ---------------------------------------------------------------------------
# TECH STACK — English.
# Every block inside `groups` is a card. Add or remove technologies inside
# `items` without touching any code.
# `icon` accepts: terminal, layers, devops, cloud, server, database, tool, cpu.
#
# `size` controls the card width on desktop (6-column grid):
#   narrow = 2 columns · half = 3 columns · wide = 4 columns
# Keep each row's sizes adding up to 6 so no gaps are left behind.
# Current split: 2+2+2 · 3+3 · 2+4
# ---------------------------------------------------------------------------

eyebrow: Tech stack
title: The tools I build with
lead: >-
  A stack that covers the whole journey: from the language and the framework to
  the container, the cloud and the dashboard that tells you whether any of it
  worked.

# `marquee` holds the rows of the logo carousel above the cards (rows alternate
# direction); each one has an `icon`, a `title` and `items`. Only technologies
# with a logo in `src/components/ui/techLogos.js` are shown. `marqueeCount` is
# the counter label.
marquee:
  - icon: terminal
    title: Languages and web
    items: [Python, TypeScript, JavaScript, Java, C++, R, HTML/CSS, React, Node.js, Express.js]
  - icon: layers
    title: Frameworks and ML
    items: [Spring Boot, FastAPI, TensorFlow, scikit-learn, Jupyter, Databricks, PyCharm, VS Code, NetBeans]
  - icon: cloud
    title: Cloud and DevOps
    items: [AWS, Azure, Docker, Kubernetes, Terraform, GitHub Actions, Jenkins, SonarQube, Azure Pipelines]
  - icon: database
    title: Data and tools
    items: [PostgreSQL, MySQL, MariaDB, MongoDB, Redis, Elastic Search, Postman, Insomnia, Wireshark]

marqueeCount: technologies

