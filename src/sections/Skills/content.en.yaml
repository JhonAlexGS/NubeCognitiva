# ---------------------------------------------------------------------------
# TECH STACK — English.
# Every block inside `groups` is a card. Add or remove technologies inside
# `items` without touching any code.
# `icon` accepts: terminal, layers, devops, cloud, server, database, tool, cpu.
#
# `size` controls the card width on desktop (6-column grid):
#   narrow = 2 columns · half = 3 columns · wide = 4 columns
# Keep each row's sizes adding up to 6 so no gaps are left behind.
# Current split: 2+2+2 · 3+3 · 2+4
# ---------------------------------------------------------------------------

eyebrow: Tech stack
title: The tools I build with
lead: >-
  A stack that covers the whole journey: from the language and the framework to
  the container, the cloud and the dashboard that tells you whether any of it
  worked.

