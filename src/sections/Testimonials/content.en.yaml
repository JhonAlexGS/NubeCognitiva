# ---------------------------------------------------------------------------
# TESTIMONIALS — English.
#
# ⚠️  A CARD ONLY SHOWS UP ON THE SITE ONCE IT HAS A `quote`.
#     The five people below are your real references with their details already
#     loaded, but `quote` is empty: until you paste their words, the section
#     stays hidden. That is deliberate — this way a real person never appears
#     signing a text they did not write.
#
# Fields per testimonial:
#   quote        → what that person says about you. WITHOUT IT, NOTHING SHOWS.
#   name         → full name
#   role         → job title
#   company      → company or university (may be left empty)
#   relationship → how they know you
#   link         → LinkedIn, portfolio or personal site; empty if none.
#                  The icon picks itself: LinkedIn or a generic link.
#   initials     → shown in the avatar when there is no photo
#   photo        → file inside `public/`, e.g. `testimonios/juan.jpg`
#                  Recommended: square, at least 200×200 px
#   phone        → NOT published. See the note below.
#   email        → NOT published. See the note below.
#
# 🔒  Phone and email are kept here as your own contact sheet, but the page
#     deliberately does NOT render them. They are third-party data and
#     publishing them on an open site exposes those people to spam.
#
# 💡  To preview the section before you have the reviews, add
#     `placeholder: true` to a card and give it a test `quote`: it will show
#     with an "example content" badge.
# ---------------------------------------------------------------------------

