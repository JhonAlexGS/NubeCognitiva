# ---------------------------------------------------------------------------
# TESTIMONIOS — español.
#
# ⚠️  UNA TARJETA SOLO APARECE EN LA WEB CUANDO TIENE `quote`.
#     Las cinco personas de abajo son tus referencias reales, con sus datos ya
#     cargados, pero `quote` está vacío: hasta que no pegues sus palabras, la
#     sección no se muestra. Es a propósito — así nunca aparece una persona
#     real firmando un texto que no escribió.
#
# Campos de cada testimonio:
#   quote        → lo que esa persona dice de ti. SIN ESTO NO SE PUBLICA.
#   name         → nombre y apellidos
#   role         → cargo
#   company      → empresa o universidad (puede quedar vacío)
#   relationship → vínculo contigo
#   link         → LinkedIn, portafolio o web personal; vacío si no tiene.
#                  El icono se elige solo: LinkedIn o enlace genérico.
#   initials     → se muestran en el avatar cuando no hay foto
#   photo        → archivo dentro de `public/`, por ejemplo `testimonios/juan.jpg`
#                  Recomendado: cuadrada, mínimo 200×200 px
#   phone        → NO se publica. Ver la nota de abajo.
#   email        → NO se publica. Ver la nota de abajo.
#
# 🔒  El teléfono y el correo se guardan aquí como ficha de contacto tuya, pero
#     la página NO los muestra a propósito. Son datos de terceros y publicarlos
#     en una web abierta expone a esas personas a spam.
#
# 💡  Para ver cómo queda la sección antes de tener las reseñas, añade
#     `placeholder: true` a una tarjeta y escríbele un `quote` de prueba: se
#     mostrará con una etiqueta de «contenido de ejemplo».
# ---------------------------------------------------------------------------

