  <text x="60" y="300" font-family="ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#5E6AD2">ANOMALÍAS</text>
  <text x="60" y="324" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#8A8F98">IOT · SERIES TEMPORALES</text>
