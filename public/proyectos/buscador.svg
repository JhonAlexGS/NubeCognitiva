    <circle cx="452" cy="228" r="3.5"/><circle cx="486" cy="246" r="3"/><circle cx="420" cy="244" r="2.5"/>
  </g>

  <!-- Grupo resaltado: el resultado -->
  <circle cx="286" cy="160" r="62" fill="#5E6AD2" fill-opacity="0.08" stroke="#8A93E8" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Lupa -->
  <g stroke="#8A93E8" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="400" cy="238" r="26"/>
    <path d="M420 258l22 22"/>
  </g>

  <text x="60" y="300" font-family="ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#5E6AD2">BÚSQUEDA SEMÁNTICA</text>
  <text x="60" y="324" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#8A8F98">EMBEDDINGS · ELASTIC · RANKING</text>
