      <stop offset="0%" stop-color="#0d1024"/><stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bus-bg)"/>
  <g stroke="#5E6AD2" stroke-opacity="0.07">
    <path d="M0 90h640M0 180h640M0 270h640M160 0v360M320 0v360M480 0v360"/>
  </g>

  <!-- Nubes de puntos agrupadas -->
  <g fill="#5E6AD2" fill-opacity="0.45">
    <circle cx="110" cy="98" r="4"/><circle cx="140" cy="120" r="3"/><circle cx="96" cy="132" r="3.5"/>
    <circle cx="128" cy="86" r="2.5"/><circle cx="158" cy="104" r="3"/>
  </g>
  <g fill="#8A93E8">
    <circle cx="262" cy="158" r="5"/><circle cx="296" cy="142" r="6"/><circle cx="286" cy="182" r="4.5"/>
    <circle cx="252" cy="192" r="4"/><circle cx="318" cy="172" r="4"/><circle cx="276" cy="124" r="3.5"/>
  </g>
  <g fill="#5E6AD2" fill-opacity="0.45">
    <circle cx="456" cy="116" r="4"/><circle cx="488" cy="136" r="3"/><circle cx="444" cy="148" r="3.5"/>
    <circle cx="506" cy="106" r="2.5"/><circle cx="472" cy="92" r="3"/>
  </g>
  <g fill="#5E6AD2" fill-opacity="0.35">
