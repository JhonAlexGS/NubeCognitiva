<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NubeCognitiva">
  <defs>
    <linearGradient id="nc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d14" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>
    <linearGradient id="nc-fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A93E8" />
      <stop offset="100%" stop-color="#5E6AD2" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#nc-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#5E6AD2" stroke-opacity="0.35" />

  <!-- Nube -->
  <path
    d="M20 42a9 9 0 0 1-.7-17.97 13 13 0 0 1 24.5 2.1A8.5 8.5 0 0 1 44 42Z"
    fill="none"
    stroke="url(#nc-fg)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <!-- Red neuronal dentro de la nube -->
  <g stroke="url(#nc-fg)" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M24 33.5 32 28.5 40 33.5" />
    <path d="M32 28.5 32 37" />
  </g>
  <g fill="#8A93E8">
    <circle cx="32" cy="27.6" r="2.6" />
    <circle cx="23.4" cy="34" r="2.2" />
    <circle cx="40.6" cy="34" r="2.2" />
    <circle cx="32" cy="37.6" r="2.2" />
  </g>

  <!-- Iniciales JG -->
  <text
    x="32"
    y="56.5"
    text-anchor="middle"
    font-family="Inter, Segoe UI, system-ui, sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="0.5"
    fill="#EDEDEF"
  >JG</text>
</svg>
